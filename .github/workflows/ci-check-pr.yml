name: PR Quality Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title
        uses: amitsingh-007/semantic-pr-title@v2.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}