name: Issue Automation

on:
  issues:
    types: [opened]

jobs:
  auto_manage_issues:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add default labels
      uses: actions-ecosystem/action-add-labels@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: needs-triage

    - name: Comment with Issue Guidelines
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.issue.number }}
        body: |
          👋 Hi! Thanks for opening an issue.

          Please confirm the following to help us review your request:

          - [ ] Clear description  
          - [ ] Expected behaviour  
          - [ ] Steps to reproduce  
          - [ ] Screenshots if possible  
          - [ ] Proper title format  

          A maintainer will review shortly. 🚀

    - name: Auto-close low quality issues
      if: contains(github.event.issue.title, 'help') || contains(github.event.issue.title, 'urgent')
      uses: peter-evans/close-issue@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        comment: |
          ❌ Issue automatically closed because the title does not meet our quality guidelines.
